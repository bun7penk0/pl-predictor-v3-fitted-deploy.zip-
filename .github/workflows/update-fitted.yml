name: Auto Update Fitted Params
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PL data + Fit MLE
        run: |
          curl -s "https://raw.githubusercontent.com/openfootball/football.json/master/2025-26/en.1.json" -o matches.json
          python3 .github/workflows/fit.py
      - name: Commit
        run: |
          git config user.name "auto-bot"
          git config user.email "bot@bot.com"
          git add pl-fitted-params.json
          git commit -m "auto update fitted $(date +%F)" || echo "no change"
          git push
